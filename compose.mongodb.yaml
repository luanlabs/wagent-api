services:
  mongo-wagent:
    image: mongo:8.0
    container_name: mongo-wagent
    restart: unless-stopped
    ports:
      - '127.0.0.1:27016:27017'
    networks:
      - wagentapi
    volumes:
      - ~/storage/mongodb/data/:/data/db/data
      - ~/storage/mongodb/log/:/data/db/log
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  wagentapi:
    name: wagentapi
    external: true
